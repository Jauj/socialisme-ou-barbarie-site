# Tests à chaque envoi ; sur main, construction de la base et publication du site
# (branche gh-pages : sources + base, Markdown, CSV et JSON construits).
name: Construction et publication

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  construire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Tests de non-régression
        run: python -m unittest discover -s tests -t . -v
      - name: Construction de la base (sans réseau)
        run: python scripts/build_db.py --sans-complet
      - name: Publication sur la branche gh-pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          find . -name __pycache__ -type d -prune -exec rm -rf {} +
          git checkout --orphan publication
          git add -A .
          git add -f data
          git commit -q -m "Site construit depuis ${GITHUB_SHA::7}"
          git push -f origin publication:gh-pages
